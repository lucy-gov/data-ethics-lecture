# Render the lecture slides with Quarto and publish them to GitHub Pages.
# The deck (slides/index.qmd) becomes the site root:
#   https://lucy-gov.github.io/data-ethics-lecture/
name: Publish slides

on:
  push:
    branches: [main]
    paths:
      - "slides/**"
      - "_extensions/**"
      - "_quarto.yml"
      - ".github/workflows/publish-slides.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render slides
        run: quarto render

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/slides

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
